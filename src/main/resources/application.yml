spring:
  jackson:
    # Leave out fields that have no value instead of sending "field": null (smaller responses; clients read a missing field as null)
    default-property-inclusion: non_null

  jpa:
    mapping-resources: META-INF/orm.xml
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        globally_quoted_identifiers: true
        # No cafe is selected while Hibernate boots, so it must not ask the (cafe-routed) datasource for metadata.
        boot:
          allow_jdbc_metadata_access: false
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  # Schema migrations are run per cafe database by TenantMigrator (control DB: db/control, cafes: db/migration).
  flyway:
    enabled: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

  servlet:
    multipart:
      # Document attachments are up to 5 MB; branding images are capped lower in BrandingService.
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native
  servlet:
    context-path: /
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:20}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    connection-timeout: 20000

app:
  jobs:
    background-enabled: ${APP_JOBS_BACKGROUND_ENABLED:true}
    # false on the headless worker: Telegram, daily close, printer alerts, SSE heartbeats and token cleanup stay on the backend
    interactive-enabled: ${APP_JOBS_INTERACTIVE_ENABLED:true}

neram:
  platform:
    # Optional: password for the first 'superadmin' account. Blank = a random one is printed once in the log.
    initial-admin-password: ${PLATFORM_ADMIN_INITIAL_PASSWORD:}
  tenancy:
    # Base64 of 32 random bytes (openssl rand -base64 32). Encrypts per-cafe DB passwords stored in the control DB.
    secret-key: ${TENANT_SECRET_KEY:}
    previous-secret-key: ${TENANT_SECRET_KEY_PREVIOUS:}
    control:
      host: ${CONTROL_DB_HOST:${DB_HOST:localhost}}
      port: ${CONTROL_DB_PORT:${DB_PORT:5432}}
      name: ${CONTROL_DB_NAME:${DB_NAME:arvi_control}}
      user: ${CONTROL_DB_USER:${DB_USER:}}
      password: ${CONTROL_DB_PASSWORD:${DB_PASSWORD:}}
      pool-size: ${HIKARI_MAX_POOL_SIZE:8}
    admin:
      # Role allowed to CREATE DATABASE / CREATE ROLE. Blank = use the control user.
      user: ${PG_ADMIN_USER:}
      password: ${PG_ADMIN_PASSWORD:}
    provision:
      db-host: ${TENANT_DB_HOST:}
      db-port: ${TENANT_DB_PORT:}
      connection-limit: ${TENANT_DB_CONNECTION_LIMIT:30}
      seed-demo-data: ${SEED_DEMO_DATA:false}
    pool:
      max-size: ${TENANT_POOL_MAX_SIZE:6}
      idle-timeout-ms: ${TENANT_POOL_IDLE_TIMEOUT_MS:120000}
      evict-after-idle-ms: ${TENANT_POOL_EVICT_AFTER_IDLE_MS:600000}
      max-pools: ${TENANT_MAX_OPEN_POOLS:100}
    migrate:
      on-startup: ${TENANT_MIGRATE_ON_STARTUP:true}
      parallelism: ${TENANT_MIGRATE_PARALLELISM:4}
  db:
    readonly:
      user: ${DB_READONLY_USER:}
      password: ${DB_READONLY_PASSWORD:}
  security:
    login:
      max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}        # wrong passwords in a row before the account locks
      ip-max-failed-attempts: ${LOGIN_IP_MAX_FAILED_ATTEMPTS:30} # failures from one address before it is blocked
      base-lock-seconds: ${LOGIN_BASE_LOCK_SECONDS:900}          # first lock: 15 minutes, doubling on repeats
      max-lock-seconds: ${LOGIN_MAX_LOCK_SECONDS:14400}          # cap: 4 hours
      failure-window-seconds: ${LOGIN_FAILURE_WINDOW_SECONDS:1800}
    seed-demo-users: ${SEED_DEMO_USERS:${SEED_DEMO_DATA:${SEED_TEST_DATA:false}}}
  seed:
    demo-data: ${SEED_DEMO_DATA:${SEED_TEST_DATA:${SEED_DEMO_USERS:false}}}
  cors:
    # Comma separated browser origins allowed to call the API cross-site; * allows all (default).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}  # default 24 hours in ms
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}  # default 30 days in ms
  printer:
    host: ${PRINTER_HOST:192.168.1.37}
    port: ${PRINTER_PORT:9100}
    enabled: ${PRINTER_ENABLED:true}
    bill-host: ${BILL_PRINTER_HOST:${PRINTER_HOST:192.168.1.37}}
    bill-port: ${BILL_PRINTER_PORT:${PRINTER_PORT:9100}}
    bill-enabled: ${BILL_PRINTER_ENABLED:${PRINTER_ENABLED:true}}
    kot-host: ${KOT_PRINTER_HOST:192.168.1.47}
    kot-port: ${KOT_PRINTER_PORT:9100}
    kot-enabled: ${KOT_PRINTER_ENABLED:true}
    juice-kot-host: ${JUICE_KOT_PRINTER_HOST:192.168.1.42}
    juice-kot-port: ${JUICE_KOT_PRINTER_PORT:9100}
    juice-kot-enabled: ${JUICE_KOT_PRINTER_ENABLED:true}
    bridge-token: ${PRINTER_BRIDGE_TOKEN:}
    # Direct server-to-printer sockets are disabled in the multi-cafe cloud service (see ThermalPrinterService).
    direct-enabled: ${PRINTER_DIRECT_ENABLED:false}
  alerts:
    printer:
      offline-after-seconds: ${PRINTER_ALERT_OFFLINE_AFTER_SECONDS:120}
      job-stuck-after-seconds: ${PRINTER_ALERT_JOB_STUCK_AFTER_SECONDS:180}
      startup-grace-seconds: ${PRINTER_ALERT_STARTUP_GRACE_SECONDS:180}
      check-interval-ms: ${PRINTER_ALERT_CHECK_INTERVAL_MS:30000}
      initial-delay-ms: ${PRINTER_ALERT_INITIAL_DELAY_MS:60000}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}

logging:
  file:
    path: ${LOG_PATH:/app/logs}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_FILE_MAX_SIZE:10MB}
      max-history: ${LOG_FILE_MAX_HISTORY:30}
      total-size-cap: ${LOG_FILE_TOTAL_SIZE_CAP:1GB}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.neram: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: WARN
    org.flywaydb: INFO
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
